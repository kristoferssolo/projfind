[package]
name = "mekle"
authors = ["Kristofers Solo <dev@kristofers.xyz>"]
version = "0.1.0"
edition = "2024"
description = "Fast project discovery tool for developers"
repository = "https://github.com/kristoferssolo/mekle"
documentation = "https://docs.rs/mekle"
homepage = "https://github.com/kristoferssolo/mekle"
license = "MIT OR Apache-2.0"
keywords = ["cli", "project", "discovery", "developer-tools"]
categories = ["command-line-utilities"]
exclude = [
  ".github/",
  ".gitignore",
  "tests/",
  "benches/",
  "justfile",
  "*.png",
  "*.md",
]
readme = "README.md"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
color-eyre = "0.6"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27"
thiserror = "2.0"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
claims = "0.8"
criterion = "0.8"
rstest = "0.26"

[lints.clippy]
pedantic = "warn"
nursery = "warn"
unwrap_used = "warn"

[[bench]]
name = "benchmark"
path = "benches/benchmark.rs"
harness = false
