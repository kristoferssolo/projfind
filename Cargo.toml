[package]
name = "projfind"
authors = [ "Kristofers Solo <dev@kristofers.xyz>" ]
version = "0.2.0"
edition = "2024"
description = "Fast project discovery tool for developers"
repository = "https://github.com/kristoferssolo/projfind"
documentation = "https://docs.rs/projfind"
homepage = "https://github.com/kristoferssolo/projfind"
license = "MIT OR Apache-2.0"
keywords = [ "cli", "project", "discovery", "developer-tools" ]
categories = [ "command-line-utilities" ]
exclude = [
  ".github/",
  ".gitignore",
  "tests/",
  "benches/",
  "justfile",
  "*.png",
  "*.md",
]
readme = "README.md"

[dependencies]
clap = {version = "4.6", features = [ "derive" ]}
color-eyre = "0.6"
regex = "1.13"
serde = {version = "1", features = [ "derive" ]}
thiserror = "2.0"
tokio = {version = "1.53", features = [
  "io-util",
  "macros",
  "process",
  "rt",
  "rt-multi-thread",
  "sync",
]}
toml = "1.1"
tracing = "0.1"
tracing-subscriber = "0.3"
which = "8.0"

[dev-dependencies]
claims = "0.8"
criterion = {version = "0.8", features = [ "async_tokio" ]}
rstest = "0.26"
tempfile = "3.27"

[lints.clippy]
pedantic = "warn"
nursery = "warn"
unwrap_used = "warn"

[[bench]]
name = "benchmark"
path = "benches/benchmark.rs"
harness = false
